<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Akun Baru</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans">

    <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden my-8 border border-slate-200">
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-violet-600 px-8 py-6 text-white text-center">
            <h2 class="text-2xl font-bold tracking-wide">Buat Akun Baru</h2>
            <p class="text-indigo-100 text-sm mt-1">Silakan isi formulir di bawah ini dengan benar</p>
        </div>

        <!-- Form Registrasi -->
        <form id="registerForm" action="dashboard-web3.html" method="GET" class="p-8 space-y-5" novalidate>
            
            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <div class="relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="text" id="username" name="username" placeholder="Masukkan username"
                        class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <p id="error-username" class="text-red-500 text-xs mt-1 hidden flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="password" name="password" placeholder="Minimal 8 karakter"
                        class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <p id="error-password" class="text-red-500 text-xs mt-1 hidden flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </p>
            </div>

            <!-- Nama Lengkap -->
            <div>
                <label for="nama" class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                <div class="relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-id-card"></i>
                    </div>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap"
                        class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <p id="error-nama" class="text-red-500 text-xs mt-1 hidden flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </p>
            </div>

            <!-- Tanggal Lahir -->
            <div>
                <label for="tanggal_lahir" class="block text-sm font-semibold text-gray-700 mb-1">Tanggal Lahir</label>
                <div class="relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir"
                        class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <p id="error-tanggal_lahir" class="text-red-500 text-xs mt-1 hidden flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </p>
            </div>

            <!-- Alamat -->
            <div>
                <label for="alamat" class="block text-sm font-semibold text-gray-700 mb-1">Alamat Lengkap</label>
                <div class="relative rounded-md shadow-sm">
                    <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat domisili"
                        class="block w-full p-3 border border-gray-300 rounded-lg text-sm transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>
                <p id="error-alamat" class="text-red-500 text-xs mt-1 hidden flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </p>
            </div>

            <!-- Nomor Telepon -->
            <div>
                <label for="telepon" class="block text-sm font-semibold text-gray-700 mb-1">Nomor Telepon</label>
                <div class="relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-phone"></i>
                    </div>
                    <input type="text" id="telepon" name="telepon" placeholder="Contoh: +628123456789"
                        class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <p id="error-telepon" class="text-red-500 text-xs mt-1 hidden flex items-center gap-1">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </p>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                Daftar Sekarang
            </button>
        </form>
    </div>

    <!-- Panggilan File JS Validasi -->
    <script src="validasi_input.js"></script>
</body>
</html>
